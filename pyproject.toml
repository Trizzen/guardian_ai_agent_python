[project]
name = "jaza-sentinel"
version = "0.1.0"
description = "Local-first human-in-the-loop control plane for Jaza Soulminder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "openai>=2.24,<3",
    "pydantic>=2.12,<3",
    "pymssql>=2.3,<3",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
legacy-gemini = [
    "google-genai==1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["backend_tests"]
pythonpath = ["."]
addopts = "-q"
